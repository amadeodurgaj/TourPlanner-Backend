server:
  port: 8080

logging:
  level:
    root: WARN
    at.fhtw.tourplanner: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF

spring:
  application:
    name: tourplanner
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  frontend:
    url: ${FRONTEND_URL}

  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600000}

  environment:
    production: ${APP_PRODUCTION:false} # set to true when deploying

openrouteservice:
  api-key: ${ORS_API_KEY}
  base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}
