server:
  port: 8080

app:
  frontend:
    url: http://localhost:3000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tourplanner
    username: touruser
    password: tourpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect